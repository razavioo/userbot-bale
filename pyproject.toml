[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "userbot-bale"
version = "0.3.0"
description = "Bale userbot runtime, MCP server, and transport core across Linux, macOS, and Windows."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "userbot-bale" }]
keywords = ["bale", "userbot", "mcp", "livekit", "voip", "data-over-sound"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Communications",
  "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
  "ggwave>=0.4.0",
  "sounddevice>=0.4.6",
  "numpy>=1.23",
]

[project.optional-dependencies]
dev = [
  "pytest>=7",
  "pytest-timeout>=2",
]
bale = [
  "livekit>=0.17",
  "livekit-api>=0.7",
  "websockets>=16",
  "python-socks[asyncio]>=2.5",
  "cryptography>=42",
  "httpx[http2]>=0.25",   # gRPC-Web auth (phone/SMS → JWT)
]
vpn-video = [
  "opencv-python-headless>=4.8",
  "qrcode>=7",
  "pillow>=10",
]
desktop = [
  "PySide6>=6.7",
]
mcp = [
  "mcp>=1.0",
]

[project.scripts]
userbot-bale = "userbot_bale.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"userbot_bale.runtime.policy_data" = ["*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
