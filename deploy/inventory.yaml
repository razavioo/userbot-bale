# userbot-bale production topology — relay-only (no coordinator).
# Each relay host runs one mesh exit-node that accepts inbound Bale calls
# from any client. The PSK in /etc/userbot-bale/vpn.psk authenticates traffic.
# Clients enter the per-relay Bale user_id (peer_id) in their app Settings
# and the app dials each one in shuffled order with fallback.

relays:
  - name: relay-1
    host: 68.183.118.171
    user: root
    remote_path: /opt/userbot-bale
    jwt_dir: /root/.userbot-bale/accounts
    etc_dir: /etc/userbot-bale
    region: ir
    wan_interface: eth0
    # JWT files in jwt_dir used by the mesh exit-node (one Bale call per JWT)
    relay_jwts:
      - account-1.jwt
      - account-2.jwt
      - account-3.jwt
      - account-4.jwt
      - account-5.jwt
      - account-6.jwt
      - account-7.jwt
      - account-8.jwt
    install_script: scripts/install-systemd-mesh.sh
    role: relay
