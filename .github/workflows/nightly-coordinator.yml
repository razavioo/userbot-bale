name: Nightly Coordinator Acceptance

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch: {}

# Spin up coordinator + 2 relays on the self-hosted runner using live Bale JWTs,
# run a full HELLO → ASSIGN → relay-callback → 1 MB tunnel smoke test, and assert
# the end-to-end handshake completes without errors.

jobs:
  coordinator-smoke:
    runs-on: [self-hosted, linux]
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: python3 -m pip install -e .[test]

      - name: Validate secrets
        env:
          COORDINATOR_JWT: ${{ secrets.COORDINATOR_JWT }}
          RELAY1_JWT: ${{ secrets.RELAY1_JWT }}
          RELAY2_JWT: ${{ secrets.RELAY2_JWT }}
          CLIENT_JWT: ${{ secrets.CLIENT_JWT }}
          COORDINATOR_PEER_ID: ${{ secrets.COORDINATOR_PEER_ID }}
          RELAY1_PEER_ID: ${{ secrets.RELAY1_PEER_ID }}
          RELAY2_PEER_ID: ${{ secrets.RELAY2_PEER_ID }}
          CLIENT_PEER_ID: ${{ secrets.CLIENT_PEER_ID }}
        run: |
          missing=""
          for name in COORDINATOR_JWT RELAY1_JWT RELAY2_JWT CLIENT_JWT \
                      COORDINATOR_PEER_ID RELAY1_PEER_ID RELAY2_PEER_ID CLIENT_PEER_ID; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "Missing required secrets:$missing" >&2
            exit 1
          fi

      - name: Unit tests (coordinator package)
        run: python3 -m pytest tests/coordinator/ -q

      - name: Run coordinator live smoke
        env:
          COORDINATOR_JWT: ${{ secrets.COORDINATOR_JWT }}
          RELAY1_JWT: ${{ secrets.RELAY1_JWT }}
          RELAY2_JWT: ${{ secrets.RELAY2_JWT }}
          CLIENT_JWT: ${{ secrets.CLIENT_JWT }}
          COORDINATOR_PEER_ID: ${{ secrets.COORDINATOR_PEER_ID }}
          RELAY1_PEER_ID: ${{ secrets.RELAY1_PEER_ID }}
          RELAY2_PEER_ID: ${{ secrets.RELAY2_PEER_ID }}
          CLIENT_PEER_ID: ${{ secrets.CLIENT_PEER_ID }}
          BALEOBALA_LOG_FORMAT: json
        run: |
          python3 scripts/smoketest_coordinator.py \
            --coordinator-jwt     "$COORDINATOR_JWT" \
            --relay1-jwt          "$RELAY1_JWT" \
            --relay2-jwt          "$RELAY2_JWT" \
            --client-jwt          "$CLIENT_JWT" \
            --coordinator-peer-id "$COORDINATOR_PEER_ID" \
            --relay1-peer-id      "$RELAY1_PEER_ID" \
            --relay2-peer-id      "$RELAY2_PEER_ID" \
            --client-peer-id      "$CLIENT_PEER_ID" \
            --payload-bytes       1048576 \
            --timeout             120 \
            --out "$RUNNER_TEMP/coordinator-smoke.json"

      - name: Upload smoke results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coordinator-smoke-results
          path: ${{ runner.temp }}/coordinator-smoke.json
