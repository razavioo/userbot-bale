name: Android Release Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag (e.g. v0.3.0)"
        required: true

# Produces signed APK + AAB artifacts and attaches them to a GitHub Release.
# Required secrets:
#   ANDROID_KEYSTORE_BASE64   — base64-encoded JKS/PKCS12 keystore
#   ANDROID_KEYSTORE_PASSWORD — keystore password
#   ANDROID_KEY_ALIAS         — key alias inside the keystore
#   ANDROID_KEY_PASSWORD      — key password (may equal keystore password)
#   COORDINATOR_PEER_ID       — long: baked into BuildConfig at compile time

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/userbot-bale-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/userbot-bale-release.jks" >> "$GITHUB_ENV"

      - name: Determine version tag
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK + AAB
        working-directory: native/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          COORDINATOR_PEER_ID: ${{ secrets.COORDINATOR_PEER_ID }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease \
            -PcoordinatorPeerId="$COORDINATOR_PEER_ID" \
            --no-daemon

      - name: Rename artifacts with version tag
        id: artifacts
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          APK_SRC="native/android/app/build/outputs/apk/release/app-release.apk"
          AAB_SRC="native/android/app/build/outputs/bundle/release/app-release.aab"
          APK_DST="userbot-bale-${TAG}.apk"
          AAB_DST="userbot-bale-${TAG}.aab"
          cp "$APK_SRC" "$APK_DST"
          cp "$AAB_SRC" "$AAB_DST"
          echo "apk=$APK_DST" >> "$GITHUB_OUTPUT"
          echo "aab=$AAB_DST" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: userbot-bale-apk-${{ steps.ver.outputs.tag }}
          path: ${{ steps.artifacts.outputs.apk }}

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: userbot-bale-aab-${{ steps.ver.outputs.tag }}
          path: ${{ steps.artifacts.outputs.aab }}

      - name: Attach to GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.artifacts.outputs.apk }}
            ${{ steps.artifacts.outputs.aab }}
          generate_release_notes: true
